    <g transform="translate(0,-40) rotate(-2)"><rect x="-84" y="-18" width="168" height="18" rx="4" fill="#cc1438"/><rect x="-84" y="-18" width="12" height="18" fill="#8f0d26"/></g>
    <g transform="translate(0,-60) rotate(2)"><rect x="-76" y="-18" width="152" height="18" rx="4" fill="#0a8a8f"/><rect x="-76" y="-18" width="12" height="18" fill="#075457"/></g>
    <g transform="translate(0,-80) rotate(-2)"><rect x="-68" y="-18" width="136" height="18" rx="4" fill="#12925c"/><rect x="-68" y="-18" width="12" height="18" fill="#0a5236"/></g>
