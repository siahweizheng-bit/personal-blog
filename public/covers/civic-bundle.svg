    <g transform="translate(0,-24) rotate(2)"><rect x="-80" y="-22" width="160" height="22" rx="4" fill="#0a3d8f"/><rect x="-80" y="-22" width="14" height="22" fill="#06245c"/></g>
    <g transform="translate(0,-48) rotate(-2)"><rect x="-70" y="-22" width="140" height="22" rx="4" fill="#cc1438"/><rect x="-70" y="-22" width="14" height="22" fill="#8f0d26"/></g>
    <!-- star on top -->
    <path transform="translate(0,-86)" fill="url(#g6)" d="M0 -16 L4.7 -5 L16 -5 L6.7 2.6 L10 14 L0 7 L-10 14 L-6.7 2.6 L-16 -5 L-4.7 -5 Z"/>
