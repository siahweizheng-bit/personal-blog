<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="公民三件套">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e4ba0"/><stop offset="1" stop-color="#06245c"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f4c531"/></linearGradient>
  </defs>
  <rect width="420" height="200" fill="url(#bg6)"/>
  <circle cx="350" cy="44" r="64" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="168" r="50" fill="#f4c531" opacity="0.08"/>
  <!-- three stacked books -->
  <g transform="translate(210,150)">
