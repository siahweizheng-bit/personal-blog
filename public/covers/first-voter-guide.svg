<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="首投族投票指南">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dce7f8"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f4c531"/></linearGradient>
  </defs>
  <rect width="420" height="200" fill="url(#bg4)"/>
  <g fill="#cc1438" opacity="0.10"><rect x="300" y="0" width="120" height="14"/><rect x="300" y="28" width="120" height="14"/><rect x="300" y="56" width="120" height="14"/></g>
  <circle cx="64" cy="150" r="52" fill="#0a3d8f" opacity="0.06"/>
  <!-- ballot box -->
  <g transform="translate(210,108)">
    <rect x="-66" y="-6" width="132" height="80" rx="10" fill="#0a3d8f"/>
    <rect x="-66" y="-6" width="132" height="80" rx="10" fill="none" stroke="#06245c" stroke-width="2"/>
    <rect x="-28" y="-20" width="56" height="14" rx="4" fill="#06245c"/>
    <!-- ballot going in -->
    <g transform="rotate(-12 0 -30)">
      <rect x="-22" y="-50" width="44" height="34" rx="3" fill="#fff" stroke="#cdd9ef" stroke-width="1.5"/>
      <path d="M-12 -34 l7 7 l13 -15" fill="none" stroke="#1a7f4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="-46" y="22" width="92" height="7" rx="3" fill="#cfe0f5"/>
    <rect x="-46" y="38" width="64" height="7" rx="3" fill="#cfe0f5"/>
    <!-- star -->
    <path transform="translate(48,58)" fill="url(#g4)" d="M0 -12 L3.5 -3.7 L12 -3.7 L5 2 L7.5 11 L0 5.5 L-7.5 11 L-5 2 L-12 -3.7 L-3.5 -3.7 Z"/>
  </g>
